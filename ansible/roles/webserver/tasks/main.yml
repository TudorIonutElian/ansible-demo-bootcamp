---
- name: Install Node.js and npm (Amazon Linux 2023)
  dnf:
    name:
      - nodejs
      - npm
    state: present

- name: Install Nginx
  dnf:
    name: nginx
    state: present

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'

- name: Copy React application source
  copy:
    src: "{{ web_source_dir }}/"
    dest: "{{ app_dir }}/"
    mode: '0755'

- name: Install npm dependencies (including dev for build)
  shell: npm install
  args:
    chdir: "{{ app_dir }}"

- name: Build React application
  shell: npm run build
  args:
    chdir: "{{ app_dir }}"
  environment:
    NODE_ENV: production

- name: Set ownership for built app
  file:
    path: "{{ app_dir }}"
    owner: nginx
    group: nginx
    recurse: yes

- name: Configure Nginx for React app
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx

- name: Enable and start Nginx
  systemd:
    name: nginx
    enabled: yes
    state: started
