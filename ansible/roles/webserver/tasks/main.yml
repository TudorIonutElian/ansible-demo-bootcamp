---
- name: Install Node.js and npm (Amazon Linux 2023)
  dnf:
    name:
      - nodejs
      - npm
    state: present

- name: Install Nginx
  dnf:
    name: nginx
    state: present

- name: Create application directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: nginx
    group: nginx
    mode: '0755'

- name: Copy React application source
  copy:
    src: "{{ web_source_dir }}/"
    dest: "{{ app_dir }}/"
    owner: nginx
    group: nginx
    mode: '0755'

- name: Install npm dependencies
  npm:
    path: "{{ app_dir }}"
    state: present
  environment:
    NODE_ENV: production

- name: Build React application
  command: npm run build
  args:
    chdir: "{{ app_dir }}"
  environment:
    NODE_ENV: production

- name: Configure Nginx for React app
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx

- name: Enable and start Nginx
  systemd:
    name: nginx
    enabled: yes
    state: started

- name: Open firewall for HTTP traffic
  firewalld:
    service: http
    permanent: yes
    state: enabled
    immediate: yes
  ignore_errors: yes
