name: Manual Full Deployment

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number for deployment'
        required: false
        default: '1'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Debug - Check if secrets are available
        run: |
          echo "AWS_ACCESS_KEY_ID is set: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}"
          echo "AWS_SECRET_ACCESS_KEY is set: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}"
          echo "AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform backend (S3 bucket)
        run: |
          chmod +x setup-backend.sh
          ./setup-backend.sh

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        env:
          TF_VAR_build_number: ${{ inputs.build_number }}
        run: terraform apply -auto-approve

      - name: Extract SSH private key
        run: |
          mkdir -p ~/.ssh
          terraform output -raw ssh_private_key > ~/.ssh/ssm-key.pem
          chmod 600 ~/.ssh/ssm-key.pem
          echo "✅ SSH key saved to ~/.ssh/ssm-key.pem"

      - name: Wait for instances to boot
        run: sleep 30

      - name: Generate Ansible inventory
        run: terraform output -raw ansible_inventory > ansible/inventory.ini

      - name: Test SSH connectivity
        working-directory: ansible
        run: |
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            if ansible web_servers -m ping -o; then
              echo "✅ All instances reachable"
              break
            elif [ $attempt -lt $max_attempts ]; then
              echo "⚠️  Retrying in 20s..."
              sleep 20
            fi
            attempt=$((attempt + 1))
          done

      - name: Deploy React app with Ansible
        working-directory: ansible
        run: ansible-playbook deploy-react-app.yml

      - name: Save deployment outputs
        if: always()
        run: |
          terraform output -json > deployment-outputs.json || true

      - name: Upload deployment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs
          path: deployment-outputs.json
          retention-days: 30
