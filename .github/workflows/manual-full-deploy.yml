name: Manual Full Deployment

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number for deployment'
        required: false
        default: '1'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          pip install ansible

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Make deploy script executable
        run: chmod +x full-deploy.sh

      - name: Run full deployment
        env:
          TF_VAR_build_number: ${{ inputs.build_number }}
        run: ./full-deploy.sh

      - name: Save deployment outputs
        if: always()
        run: |
          terraform output -json > deployment-outputs.json || true

      - name: Upload deployment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs
          path: deployment-outputs.json
          retention-days: 30
