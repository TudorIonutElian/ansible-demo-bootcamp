name: Manual Infrastructure Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "DESTROY" to confirm infrastructure destruction'
        required: true
        type: string

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "❌ ERROR: Confirmation failed. You must type 'DESTROY' to proceed."
            exit 1
          fi
          echo "✅ Confirmation validated. Proceeding with infrastructure destruction..."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform backend (S3 bucket)
        run: |
          chmod +x setup-backend.sh
          ./setup-backend.sh

      - name: Terraform Init
        run: terraform init

      - name: Show what will be destroyed
        run: |
          echo "📋 The following resources will be DESTROYED:"
          terraform plan -destroy

      - name: Terraform Destroy
        run: |
          echo "🔥 Destroying infrastructure..."
          terraform destroy -auto-approve

      - name: Verify destruction
        run: |
          echo "✅ Destruction complete. Verifying..."
          terraform show

      - name: Save destruction log
        if: always()
        run: |
          terraform show > destruction-log.txt || echo "No state remaining" > destruction-log.txt
          echo "Destroyed at: $(date)" >> destruction-log.txt

      - name: Upload destruction log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destruction-log
          path: destruction-log.txt
          retention-days: 90
